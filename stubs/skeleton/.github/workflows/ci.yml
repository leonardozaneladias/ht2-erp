name: CI

on:
    push:
        branches: [main, develop]
    pull_request:
        branches: [main, develop]

concurrency:
    group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
    cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
    quality:
        name: Qualidade (Pint + PHPStan + Prettier)
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7

            - name: Setup PHP 8.4
              uses: shivammathur/setup-php@v2
              with:
                  php-version: '8.4'
                  extensions: pdo, pdo_sqlite, sqlite3, redis, bcmath, mbstring, xml
                  coverage: none

            # Os pacotes ht2ml/* são PRIVADOS e o composer.json os declara por SSH
            # (git@github.com:...), que é o que funciona na máquina de quem
            # desenvolve. O runner não tem essa chave — então reescrevemos SSH para
            # HTTPS autenticado por token. Assim o composer.json não precisa mudar
            # de forma dependendo de onde roda.
            - name: Autenticar nos pacotes privados
              run: |
                  git config --global url."https://x-access-token:${{ secrets.COMPOSER_TOKEN }}@github.com/".insteadOf "git@github.com:"

            - name: Instalar dependências PHP
              run: composer install --no-interaction --prefer-dist --optimize-autoloader

            - name: Setup Node 22
              uses: actions/setup-node@v6
              with:
                  node-version: '22'
                  cache: 'npm'

            - name: Instalar dependências Node
              run: npm ci

            - name: Formatação PHP (Pint)
              run: ./vendor/bin/pint --test

            - name: Análise estática (PHPStan)
              run: ./vendor/bin/phpstan analyse --no-progress --error-format=github

            - name: Formatação (Prettier)
              run: npx prettier --check "resources/**/*.{js,ts,tsx,css,json}" "*.{json,md,yaml,yml}" --ignore-path .prettierignore

    tests:
        name: Testes (Pest)
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7

            - name: Setup PHP 8.4
              uses: shivammathur/setup-php@v2
              with:
                  php-version: '8.4'
                  extensions: pdo, pdo_sqlite, sqlite3, redis, bcmath, mbstring, xml
                  coverage: none

            - name: Autenticar nos pacotes privados
              run: |
                  git config --global url."https://x-access-token:${{ secrets.COMPOSER_TOKEN }}@github.com/".insteadOf "git@github.com:"

            - name: Instalar dependências PHP
              run: composer install --no-interaction --prefer-dist --optimize-autoloader

            - name: Copiar .env
              run: cp .env.example .env

            - name: Gerar APP_KEY
              run: php artisan key:generate

            # Os assets são pré-requisito das telas: sem o manifest do Vite, toda
            # página devolve 500. O Composer não carrega dependência npm, então
            # este passo não é opcional.
            - name: Setup Node 22
              uses: actions/setup-node@v6
              with:
                  node-version: '22'
                  cache: 'npm'

            - name: Compilar assets
              run: npm ci && npm run build

            - name: Rodar testes
              run: php artisan test --compact
              env:
                  APP_ENV: testing
                  DB_CONNECTION: sqlite
                  DB_DATABASE: ':memory:'
                  CACHE_STORE: array
                  QUEUE_CONNECTION: sync
                  SESSION_DRIVER: array
