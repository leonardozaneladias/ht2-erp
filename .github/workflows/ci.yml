name: CI

on:
    push:
        branches: [main, develop, 'feature/**', 'bugfix/**']
    pull_request:
        branches: [main, develop]

jobs:
    quality:
        name: Qualidade (Pint + PHPStan + Prettier)
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v4

            - name: Setup PHP 8.4
              uses: shivammathur/setup-php@v2
              with:
                  php-version: '8.4'
                  extensions: pdo, pdo_sqlite, sqlite3, redis, bcmath, mbstring, xml
                  coverage: none

            - name: Cache Composer
              uses: actions/cache@v4
              with:
                  path: vendor
                  key: composer-${{ hashFiles('composer.lock') }}
                  restore-keys: composer-

            - name: Instalar dependências PHP
              run: composer install --no-interaction --prefer-dist --optimize-autoloader

            - name: Setup Node 22
              uses: actions/setup-node@v4
              with:
                  node-version: '22'
                  cache: 'npm'

            - name: Instalar dependências Node
              run: npm ci

            - name: Verificar formatação PHP (Pint)
              run: ./vendor/bin/pint --test

            - name: Análise estática (PHPStan level 6)
              run: ./vendor/bin/phpstan analyse --no-progress --error-format=github

            - name: Verificar formatação (Prettier)
              run: npx prettier --check "resources/**/*.{js,ts,tsx,css,json}" "*.{json,md,yaml,yml}" --ignore-path .prettierignore

    tests:
        name: Testes (Pest)
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v4

            - name: Setup PHP 8.4
              uses: shivammathur/setup-php@v2
              with:
                  php-version: '8.4'
                  extensions: pdo, pdo_sqlite, sqlite3, redis, bcmath, mbstring, xml
                  coverage: none

            - name: Cache Composer
              uses: actions/cache@v4
              with:
                  path: vendor
                  key: composer-${{ hashFiles('composer.lock') }}
                  restore-keys: composer-

            - name: Instalar dependências PHP
              run: composer install --no-interaction --prefer-dist --optimize-autoloader

            - name: Copiar .env
              run: cp .env.example .env

            - name: Gerar APP_KEY
              run: php artisan key:generate

            - name: Rodar testes
              run: php artisan test --compact --exclude-group=browser
              env:
                  APP_ENV: testing
                  DB_CONNECTION: sqlite
                  DB_DATABASE: ':memory:'
                  CACHE_STORE: array
                  QUEUE_CONNECTION: sync
                  SESSION_DRIVER: array
                  JWT_DRAFT_TOKEN_SECRET: ci_secret_key_for_tests_only_minimum_32_chars
