name: CI

on:
    # Sem globs de branch de trabalho aqui: o gatilho de pull_request já cobre
    # toda branch com PR aberto, e listá-la nos dois faria a mesma commit rodar
    # duas vezes. (Os globs anteriores — feature/** e bugfix/** — não casavam
    # com a convenção do projeto, que é feat/, fix/, chore/, docs/, refactor/,
    # então a execução dupla não chegou a acontecer. Foi sorte, não desenho.)
    push:
        branches: [main, develop]
    pull_request:
        branches: [main, develop]

# Um push novo torna o run anterior da mesma branch inútil — ninguém lê o
# resultado de um commit que já foi substituído. Sem isto, o Dependabot (que
# rebaseia e força push) chegou a deixar 4 execuções vivas do mesmo PR.
#
# A main é a exceção: com required_status_checks.strict = false, a branch não
# precisa estar atualizada antes do merge, então o run pós-merge é a única coisa
# que testa a combinação real de dois PRs. Esse não se cancela.
concurrency:
    group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
    cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
    quality:
        name: Qualidade (Pint + PHPStan + Prettier)
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v7

            - name: Setup PHP 8.4
              uses: shivammathur/setup-php@v2
              with:
                  php-version: '8.4'
                  extensions: pdo, pdo_sqlite, sqlite3, redis, bcmath, mbstring, xml
                  coverage: none

            - name: Cache Composer
              uses: actions/cache@v6
              with:
                  path: vendor
                  key: composer-${{ hashFiles('composer.lock') }}
                  restore-keys: composer-

            - name: Instalar dependências PHP
              run: composer install --no-interaction --prefer-dist --optimize-autoloader

            - name: Setup Node 22
              uses: actions/setup-node@v6
              with:
                  node-version: '22'
                  cache: 'npm'

            - name: Instalar dependências Node
              run: npm ci

            - name: Verificar formatação PHP (Pint)
              run: ./vendor/bin/pint --test

            - name: Análise estática (PHPStan level 6)
              run: ./vendor/bin/phpstan analyse --no-progress --error-format=github

            - name: Lint JS (ESLint)
              run: npm run lint:js:check

            # Informativo: surfa advisories sem reprovar o build. Há advisories
            # transitivas pré-existentes; o Dependabot abre PRs de remediação.
            - name: Auditoria de dependências (Composer)
              run: composer audit --no-interaction
              continue-on-error: true

            # Guard das dependências declaradas. Não dá para escrever em Pest:
            # "esta classe vem de um pacote que este composer.json declara?"
            # exige o mapa classe -> pacote que o Composer monta, e reimplementá-lo
            # em teste seria reimplementar o Composer.
            #
            # O symlink existe porque a ferramenta procura o autoload ao lado do
            # composer.json que analisa, e num monorepo com path repos os pacotes
            # não têm vendor próprio. Instalar cinco vendors só para analisar
            # custaria minutos de CI para responder a mesma pergunta.
            - name: Cada pacote declara o que usa
              run: |
                  falhou=0
                  for p in core extensao-rh extensao-fiscal-br extensao-exemplo-demo extensao-documentos; do
                      echo "::group::$p"
                      ln -sfn ../../vendor "packages/$p/vendor"
                      ./vendor/bin/composer-dependency-analyser \
                          --composer-json="packages/$p/composer.json" \
                          --config=composer-dependency-analyser.php || falhou=1
                      rm -f "packages/$p/vendor"
                      echo "::endgroup::"
                  done
                  exit $falhou

            - name: Verificar formatação (Prettier)
              run: npx prettier --check "resources/**/*.{js,ts,tsx,css,json}" "*.{json,md,yaml,yml}" --ignore-path .prettierignore

    core-sozinho:
        # Guard A4 do plano de revisão arquitetural.
        #
        # O monorepo NUNCA exercita este caminho: aqui o core convive com o app,
        # com as quatro extensões e com um vendor já povoado, então uma
        # dependência que o core usa mas não declara, ou uma referência do core a
        # algo do produto, passa despercebida. É exatamente o caminho do
        # EduConecta, que instala ht2ml/core por Composer e mais nada.
        #
        # A receita está em docs/superficie-do-core.md e era manual — rodava
        # quando alguém lembrava. Rodando aqui, para de depender de memória.
        name: Core sozinho num Laravel limpo
        runs-on: ubuntu-latest

        env:
            DB_CONNECTION: sqlite
            DB_DATABASE: /tmp/prova/database/database.sqlite

        steps:
            - uses: actions/checkout@v4

            - name: Setup PHP 8.4
              uses: shivammathur/setup-php@v2
              with:
                  php-version: '8.4'
                  extensions: mbstring, xml, ctype, iconv, intl, pdo_sqlite, dom, fileinfo, bcmath, gd, zip
                  coverage: none

            - name: Criar um Laravel limpo
              run: composer create-project laravel/laravel /tmp/prova --no-interaction --prefer-dist

            - name: Instalar SÓ o ht2ml/core
              working-directory: /tmp/prova
              run: |
                  composer config repositories.ht2ml path "$GITHUB_WORKSPACE/packages/*"
                  composer config minimum-stability dev
                  composer config prefer-stable true
                  composer require ht2ml/core:@dev --no-interaction

            - name: Migrar, sincronizar permissões e diagnosticar
              working-directory: /tmp/prova
              run: |
                  touch database/database.sqlite
                  php artisan migrate --force --no-interaction
                  php artisan access:sync --no-interaction
                  php artisan ht2ml:doutor

            - name: A superfície prometida existe
              working-directory: /tmp/prova
              # Sem asserções, o job provaria só que o composer não quebrou. Estas
              # três são o que o produto consome no primeiro dia: o painel, o
              # catálogo de permissões e a sidebar.
              run: |
                  php artisan route:list --name=admin. > /tmp/rotas.txt
                  test "$(grep -c 'admin\.' /tmp/rotas.txt)" -gt 50 \
                    || { echo "::error::menos de 50 rotas admin.* — o painel não subiu"; cat /tmp/rotas.txt; exit 1; }
                  # `tinker --execute` SEMPRE sai com 1, inclusive num exit(0)
                  # explícito. Confiar no código de saída dele deixaria o job
                  # vermelho por motivo errado — comparar a saída é o que funciona.
                  areas=$(php artisan tinker --execute='echo count((array) config("access.modules"));')
                  test "$areas" -gt 0 \
                    || { echo "::error::config(access.modules) vazio — o catálogo de permissões não chegou"; exit 1; }
                  secoes=$(php artisan tinker --execute='echo count((array) config("admin-menu"));')
                  test "$secoes" -gt 0 \
                    || { echo "::error::config(admin-menu) vazio — a sidebar não chegou"; exit 1; }

            - name: O caminho do EduConecta — módulo, recurso, tela alcançável
              working-directory: /tmp/prova
              # É a sequência do primeiro dia de um produto novo, e o único lugar
              # onde ela roda de verdade: no monorepo o gerador acha tudo pronto.
              # Foi escrevendo este passo que apareceu o make:recurso sem --modulo
              # estourando FileNotFoundException DEPOIS de escrever 19 arquivos.
              run: |
                  php artisan make:modulo sonda
                  composer require ht2ml/extensao-sonda:@dev --no-interaction
                  php artisan make:recurso Leitura --modulo=sonda --fields="nome:string, valor:money"
                  php artisan migrate --force --no-interaction
                  php artisan access:sync --no-interaction
                  php artisan ht2ml:doutor
                  php artisan route:list --name=sonda | grep -q 'admin.sonda.leituras.index' \
                    || { echo "::error::a tela gerada não tem rota"; exit 1; }
                  permissoes=$(php artisan tinker --execute='echo count(array_filter(array_keys((array) config("access.modules.negocio", [])), fn ($p) => str_starts_with($p, "sonda.")));')
                  test "$permissoes" -eq 6 \
                    || { echo "::error::esperava 6 permissões do recurso, veio $permissoes"; exit 1; }

            - name: O gerador recusa o modo sem módulo, em vez de quebrar no meio
              working-directory: /tmp/prova
              # Sem --modulo o gerador ligaria a tela em três arquivos que hoje
              # vivem dentro do core. Precisa recusar ANTES de escrever, e dizer
              # o que fazer.
              run: |
                  if php artisan make:recurso Avulso --fields="nome:string" > /tmp/avulso.txt 2>&1; then
                      echo "::error::make:recurso sem --modulo deveria falhar"; cat /tmp/avulso.txt; exit 1
                  fi
                  grep -q 'make:modulo' /tmp/avulso.txt \
                    || { echo "::error::a recusa não ensina o caminho novo"; cat /tmp/avulso.txt; exit 1; }
                  test ! -f app/Models/Avulso.php \
                    || { echo "::error::recusou mas escreveu arquivos assim mesmo"; exit 1; }

    tests:
        name: Testes (Pest)
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v7

            - name: Setup PHP 8.4
              uses: shivammathur/setup-php@v2
              with:
                  php-version: '8.4'
                  extensions: pdo, pdo_sqlite, sqlite3, redis, bcmath, mbstring, xml
                  coverage: none

            - name: Cache Composer
              uses: actions/cache@v6
              with:
                  path: vendor
                  key: composer-${{ hashFiles('composer.lock') }}
                  restore-keys: composer-

            - name: Instalar dependências PHP
              run: composer install --no-interaction --prefer-dist --optimize-autoloader

            - name: Copiar .env
              run: cp .env.example .env

            - name: Gerar APP_KEY
              run: php artisan key:generate

            - name: Diagnóstico dos módulos
              run: php artisan ht2ml:doutor
              env:
                  APP_ENV: testing
                  DB_CONNECTION: sqlite
                  DB_DATABASE: ':memory:'
                  CACHE_STORE: array

            - name: Rodar testes
              run: php artisan test --compact --testsuite=Unit,Feature,Extensoes,Arch
              env:
                  APP_ENV: testing
                  DB_CONNECTION: sqlite
                  DB_DATABASE: ':memory:'
                  CACHE_STORE: array
                  QUEUE_CONNECTION: sync
                  SESSION_DRIVER: array
                  JWT_DRAFT_TOKEN_SECRET: ci_secret_key_for_tests_only_minimum_32_chars

    browser:
        name: Testes de browser (Pest + Playwright)
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v7

            - name: Setup PHP 8.4
              uses: shivammathur/setup-php@v2
              with:
                  php-version: '8.4'
                  extensions: pdo, pdo_sqlite, sqlite3, redis, bcmath, mbstring, xml
                  coverage: none

            - name: Cache Composer
              uses: actions/cache@v6
              with:
                  path: vendor
                  key: composer-${{ hashFiles('composer.lock') }}
                  restore-keys: composer-

            - name: Instalar dependências PHP
              run: composer install --no-interaction --prefer-dist --optimize-autoloader

            - name: Setup Node 22
              uses: actions/setup-node@v6
              with:
                  node-version: '22'
                  cache: 'npm'

            - name: Instalar dependências Node
              run: npm ci

            - name: Cache Playwright (Chromium)
              uses: actions/cache@v6
              with:
                  path: ~/.cache/ms-playwright
                  key: playwright-${{ hashFiles('package-lock.json') }}
                  restore-keys: playwright-

            - name: Instalar Chromium do Playwright
              # Sem --with-deps: as libs de sistema já vêm no ubuntu-latest.
              # O --with-deps roda apt-get (baixa fontes etc.) e trava no runner.
              run: npx playwright install chromium

            - name: Copiar .env
              run: cp .env.example .env

            - name: Gerar APP_KEY
              run: php artisan key:generate

            - name: Compilar assets (Vite)
              run: npm run build

            - name: Rodar testes de browser
              run: ./vendor/bin/pest --group=browser
              env:
                  APP_ENV: testing
                  DB_CONNECTION: sqlite
                  DB_DATABASE: ':memory:'
                  CACHE_STORE: array
                  QUEUE_CONNECTION: sync
                  SESSION_DRIVER: array
                  JWT_DRAFT_TOKEN_SECRET: ci_secret_key_for_tests_only_minimum_32_chars
