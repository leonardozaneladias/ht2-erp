name: CI

on:
    # Sem globs de branch de trabalho aqui: o gatilho de pull_request já cobre
    # toda branch com PR aberto, e listá-la nos dois faria a mesma commit rodar
    # duas vezes. (Os globs anteriores — feature/** e bugfix/** — não casavam
    # com a convenção do projeto, que é feat/, fix/, chore/, docs/, refactor/,
    # então a execução dupla não chegou a acontecer. Foi sorte, não desenho.)
    push:
        branches: [main, develop]
    pull_request:
        branches: [main, develop]

# Um push novo torna o run anterior da mesma branch inútil — ninguém lê o
# resultado de um commit que já foi substituído. Sem isto, o Dependabot (que
# rebaseia e força push) chegou a deixar 4 execuções vivas do mesmo PR.
#
# A main é a exceção: com required_status_checks.strict = false, a branch não
# precisa estar atualizada antes do merge, então o run pós-merge é a única coisa
# que testa a combinação real de dois PRs. Esse não se cancela.
concurrency:
    group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
    cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
    quality:
        name: Qualidade (Pint + PHPStan + Prettier)
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v7

            - name: Setup PHP 8.4
              uses: shivammathur/setup-php@v2
              with:
                  php-version: '8.4'
                  extensions: pdo, pdo_sqlite, sqlite3, redis, bcmath, mbstring, xml
                  coverage: none

            - name: Cache Composer
              uses: actions/cache@v6
              with:
                  path: vendor
                  key: composer-${{ hashFiles('composer.lock') }}
                  restore-keys: composer-

            - name: Instalar dependências PHP
              run: composer install --no-interaction --prefer-dist --optimize-autoloader

            - name: Setup Node 22
              uses: actions/setup-node@v6
              with:
                  node-version: '22'
                  cache: 'npm'

            - name: Instalar dependências Node
              run: npm ci

            - name: Verificar formatação PHP (Pint)
              run: ./vendor/bin/pint --test

            - name: Análise estática (PHPStan level 6)
              run: ./vendor/bin/phpstan analyse --no-progress --error-format=github

            - name: Lint JS (ESLint)
              run: npm run lint:js:check

            # Informativo: surfa advisories sem reprovar o build. Há advisories
            # transitivas pré-existentes; o Dependabot abre PRs de remediação.
            - name: Auditoria de dependências (Composer)
              run: composer audit --no-interaction
              continue-on-error: true

            - name: Verificar formatação (Prettier)
              run: npx prettier --check "resources/**/*.{js,ts,tsx,css,json}" "*.{json,md,yaml,yml}" --ignore-path .prettierignore

    tests:
        name: Testes (Pest)
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v7

            - name: Setup PHP 8.4
              uses: shivammathur/setup-php@v2
              with:
                  php-version: '8.4'
                  extensions: pdo, pdo_sqlite, sqlite3, redis, bcmath, mbstring, xml
                  coverage: none

            - name: Cache Composer
              uses: actions/cache@v6
              with:
                  path: vendor
                  key: composer-${{ hashFiles('composer.lock') }}
                  restore-keys: composer-

            - name: Instalar dependências PHP
              run: composer install --no-interaction --prefer-dist --optimize-autoloader

            - name: Copiar .env
              run: cp .env.example .env

            - name: Gerar APP_KEY
              run: php artisan key:generate

            - name: Diagnóstico dos módulos
              run: php artisan ht2ml:doutor
              env:
                  APP_ENV: testing
                  DB_CONNECTION: sqlite
                  DB_DATABASE: ':memory:'
                  CACHE_STORE: array

            - name: Rodar testes
              run: php artisan test --compact --testsuite=Unit,Feature,Extensoes,Arch
              env:
                  APP_ENV: testing
                  DB_CONNECTION: sqlite
                  DB_DATABASE: ':memory:'
                  CACHE_STORE: array
                  QUEUE_CONNECTION: sync
                  SESSION_DRIVER: array
                  JWT_DRAFT_TOKEN_SECRET: ci_secret_key_for_tests_only_minimum_32_chars

    browser:
        name: Testes de browser (Pest + Playwright)
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v7

            - name: Setup PHP 8.4
              uses: shivammathur/setup-php@v2
              with:
                  php-version: '8.4'
                  extensions: pdo, pdo_sqlite, sqlite3, redis, bcmath, mbstring, xml
                  coverage: none

            - name: Cache Composer
              uses: actions/cache@v6
              with:
                  path: vendor
                  key: composer-${{ hashFiles('composer.lock') }}
                  restore-keys: composer-

            - name: Instalar dependências PHP
              run: composer install --no-interaction --prefer-dist --optimize-autoloader

            - name: Setup Node 22
              uses: actions/setup-node@v6
              with:
                  node-version: '22'
                  cache: 'npm'

            - name: Instalar dependências Node
              run: npm ci

            - name: Cache Playwright (Chromium)
              uses: actions/cache@v6
              with:
                  path: ~/.cache/ms-playwright
                  key: playwright-${{ hashFiles('package-lock.json') }}
                  restore-keys: playwright-

            - name: Instalar Chromium do Playwright
              # Sem --with-deps: as libs de sistema já vêm no ubuntu-latest.
              # O --with-deps roda apt-get (baixa fontes etc.) e trava no runner.
              run: npx playwright install chromium

            - name: Copiar .env
              run: cp .env.example .env

            - name: Gerar APP_KEY
              run: php artisan key:generate

            - name: Compilar assets (Vite)
              run: npm run build

            - name: Rodar testes de browser
              run: ./vendor/bin/pest --group=browser
              env:
                  APP_ENV: testing
                  DB_CONNECTION: sqlite
                  DB_DATABASE: ':memory:'
                  CACHE_STORE: array
                  QUEUE_CONNECTION: sync
                  SESSION_DRIVER: array
                  JWT_DRAFT_TOKEN_SECRET: ci_secret_key_for_tests_only_minimum_32_chars
