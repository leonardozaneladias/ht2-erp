openapi: 3.1.0
info:
    title: Portal ArtFinal API
    version: 1.0.0
    description: |
        API pública da Plataforma de Gestão de Formaturas ArtFinal.

        - Convenções transversais: `docs/api/api-conventions.md`.
        - Envelope de erro único: `docs/api/error-envelope.md`.
        - Contrato endpoint por endpoint: `docs/api/api-contract.md`.
        - Integrações externas: `docs/api/integrations.md`.
        - Changelog e política de deprecação (RFC 8594): `docs/api/api-CHANGELOG.md`.

        Este documento é o **esqueleto** OpenAPI. Apenas 3 endpoints estão totalmente especificados
        como modelo (login, criar reserva, webhook de pagamento). Os demais estão referenciados nos
        paths com `$ref` para os schemas de resource/error e `description` apontando para o contrato.
        A versão completa é gerada em runtime por `dedoc/scramble` a partir de FormRequests e Resources.
    contact:
        name: Engenharia ArtFinal
        email: engenharia@portalartfinal.com.br
    license:
        name: Proprietary

servers:
    - url: https://api.portalartfinal.com.br/api/v1
      description: Produção
    - url: https://staging.api.portalartfinal.com.br/api/v1
      description: Staging
    - url: http://localhost/api/v1
      description: Desenvolvimento local (Laradock)

tags:
    - name: Autenticação
      description: Login, logout e contexto do usuário.
    - name: FormandoMe
      description: Rotas sob /me/* — contexto do formando logado.
    - name: Eventos
      description: Leitura de eventos vinculados ao usuário.
    - name: Convites
      description: CRUD de convites, emissão em lote e RSVP via token mágico.
    - name: Seating
      description: Mapa de mesas, reservas, hold/confirmação.
    - name: Extras
      description: Catálogo e pedido de produtos extras.
    - name: Pagamentos
      description: Intents e consulta de pagamento.
    - name: Enquetes
      description: Listagem, detalhe e voto.
    - name: Webhooks
      description: Endpoints consumidos por provedores externos.

security:
    - sanctumCookie: []
    - bearerAuth: []

components:
    securitySchemes:
        sanctumCookie:
            type: apiKey
            in: cookie
            name: laravel_session
            description: |
                Cookie de sessão criado pelo fluxo SPA Sanctum. Requer que o cliente
                tenha chamado `GET /sanctum/csrf-cookie` antes do `POST /auth/login` com `mode=spa`.
        bearerAuth:
            type: http
            scheme: bearer
            bearerFormat: sanctum-token
            description: |
                Token pessoal Sanctum emitido em `POST /auth/login` com `mode=token`.
                Enviar como `Authorization: Bearer <token>`.
        conviteToken:
            type: apiKey
            in: path
            name: token
            description: |
                Token mágico enviado ao convidado no e-mail. Resolve via middleware
                `ResolveConviteToken` que compara `sha256(token)` com `convites.token_hash`.

    parameters:
        UlidPathParam:
            name: ulid
            in: path
            required: true
            description: Identificador público `CHAR(26)` (ULID).
            schema:
                type: string
                minLength: 26
                maxLength: 26
                pattern: '^[0-9A-HJKMNP-TV-Z]{26}$'
                example: 01J5K2N7QMHV1FJZ8H0PR3RV9C

        PageSize:
            name: page[size]
            in: query
            required: false
            description: Itens por página (max 100, default 50).
            schema:
                type: integer
                minimum: 1
                maximum: 100
                default: 50

        PageCursor:
            name: page[cursor]
            in: query
            required: false
            description: Cursor opaco para paginação. Ignorado se inválido.
            schema:
                type: string

        SortParam:
            name: sort
            in: query
            required: false
            description: |
                Ordenação. Campos separados por vírgula. Prefixo `-` para descendente.
                Ex.: `sort=-created_at,codigo`.
            schema:
                type: string

        XIdempotencyKeyHeader:
            name: X-Idempotency-Key
            in: header
            required: true
            description: |
                Chave única do cliente para deduplicar POSTs sensíveis. Max 80 chars.
                Reutilização com payload diferente → 409 IdempotencyConflict.
            schema:
                type: string
                maxLength: 80

        XRequestIdHeader:
            name: X-Request-Id
            in: header
            required: false
            description: |
                Identificador opcional do cliente. Sempre ecoado no response.
                Quando ausente, middleware `AttachRequestId` gera um ULID.
            schema:
                type: string

        XCorrelationIdHeader:
            name: X-Correlation-Id
            in: header
            required: false
            description: Propaga correlation id de domínio entre webhooks e jobs.
            schema:
                type: string

    headers:
        DeprecationHeader:
            description: Presente em endpoints deprecados (RFC 8594).
            schema:
                type: boolean
                example: true
        SunsetHeader:
            description: Data a partir da qual o endpoint retorna 410.
            schema:
                type: string
                format: http-date
        LinkSuccessor:
            description: URL da versão sucessora.
            schema:
                type: string
        RetryAfter:
            description: Segundos até nova tentativa.
            schema:
                type: integer

    schemas:
        # -----------------------------
        # Envelope de erro
        # -----------------------------
        ErrorEnvelope:
            type: object
            required: [error, message, request_id, timestamp]
            properties:
                error:
                    type: string
                    description: Chave constante. Cliente faz branch por este campo.
                    examples:
                        - ValidationError
                        - Forbidden
                        - AssentoIndisponivel
                        - HoldExpirado
                        - CotaEsgotada
                        - IdempotencyConflict
                        - RateLimitExceeded
                        - InternalServerError
                message:
                    type: string
                    description: Texto amigável em PT-BR.
                details:
                    type: object
                    nullable: true
                    additionalProperties: true
                    properties:
                        fields:
                            type: object
                            description: Em ValidationError, campo → lista de mensagens.
                            additionalProperties:
                                type: array
                                items:
                                    type: string
                request_id:
                    type: string
                    description: ULID ecoado do header X-Request-Id.
                timestamp:
                    type: string
                    format: date-time

        # -----------------------------
        # Paginação canônica
        # -----------------------------
        PaginationMeta:
            type: object
            required: [per_page]
            properties:
                per_page:
                    type: integer
                next_cursor:
                    type: string
                    nullable: true
                prev_cursor:
                    type: string
                    nullable: true
                total:
                    type: integer
                    description: Presente apenas em length-aware offset.
                current_page:
                    type: integer
                last_page:
                    type: integer

        PaginationLinks:
            type: object
            required: [self]
            properties:
                self: { type: string }
                next: { type: string, nullable: true }
                prev: { type: string, nullable: true }

        ResourceLinks:
            type: object
            required: [self]
            properties:
                self:
                    type: string
            additionalProperties:
                type: string
                nullable: true

        # -----------------------------
        # Autenticação
        # -----------------------------
        LoginRequest:
            type: object
            required: [email, password, mode]
            properties:
                email:
                    type: string
                    format: email
                    maxLength: 150
                password:
                    type: string
                    minLength: 8
                    maxLength: 128
                mode:
                    type: string
                    enum: [spa, token]
                remember:
                    type: boolean
                    default: false
                device_name:
                    type: string
                    maxLength: 60
                    description: Obrigatório quando mode=token.

        LoginSpaResponse:
            type: object
            properties:
                status: { type: string, example: ok }
                user:
                    $ref: '#/components/schemas/MeUser'

        LoginTokenResponse:
            type: object
            properties:
                access_token: { type: string, example: '1|aBc123...' }
                abilities:
                    type: array
                    items: { type: string }
                user:
                    $ref: '#/components/schemas/MeUser'

        MeUser:
            type: object
            properties:
                id: { type: string, description: ULID }
                nome: { type: string }
                email: { type: string, format: email }
                tipo:
                    type: string
                    enum: [formando, comissao, responsavel_financeiro, admin]

        # -----------------------------
        # Eventos
        # -----------------------------
        EventoResource:
            type: object
            required: [id, slug, nome, data_evento, status]
            properties:
                id: { type: string, description: ULID }
                slug: { type: string }
                nome: { type: string }
                data_evento: { type: string, format: date-time }
                status:
                    type: string
                    enum: [rascunho, publicado, encerrado, arquivado]
                janelas:
                    type: object
                    properties:
                        abre_rsvp_at: { type: string, format: date-time, nullable: true }
                        fecha_rsvp_at: { type: string, format: date-time, nullable: true }
                        abre_mesas_at: { type: string, format: date-time, nullable: true }
                        fecha_mesas_at: { type: string, format: date-time, nullable: true }
                config:
                    type: object
                    additionalProperties: true
                links:
                    $ref: '#/components/schemas/ResourceLinks'

        # -----------------------------
        # Convites
        # -----------------------------
        ConviteResource:
            type: object
            required: [id, codigo, status, tipo]
            properties:
                id: { type: string }
                codigo: { type: string, description: 'Legível, curto, UNIQUE' }
                status:
                    type: string
                    enum: [rascunho, emitido, enviado, visualizado, confirmado, recusado, cancelado, inutilizado]
                tipo:
                    type: string
                    enum: [nominal, transferivel, cortesia, staff, extra]
                convidado:
                    type: object
                    properties:
                        nome: { type: string }
                        email: { type: string, format: email, nullable: true }
                        telefone: { type: string, nullable: true }
                entregue_at: { type: string, format: date-time, nullable: true }
                visualizado_at: { type: string, format: date-time, nullable: true }
                confirmado_at: { type: string, format: date-time, nullable: true }
                links:
                    $ref: '#/components/schemas/ResourceLinks'

        CriarConviteRequest:
            type: object
            required: [tipo, convidado, origem_cota]
            properties:
                tipo:
                    type: string
                    enum: [nominal, transferivel, cortesia]
                convidado:
                    type: object
                    required: [nome]
                    properties:
                        nome: { type: string, maxLength: 150 }
                        email: { type: string, format: email, maxLength: 150 }
                        telefone: { type: string, maxLength: 30 }
                origem_cota:
                    type: string
                    enum: [base, transferivel, cortesia, staff]

        LoteConviteResource:
            type: object
            required: [id, status, qtd_total, qtd_processados]
            properties:
                id: { type: string }
                status:
                    type: string
                    enum: [processando, concluido, falhou]
                qtd_total: { type: integer }
                qtd_processados: { type: integer }
                qtd_falhados: { type: integer }
                iniciado_at: { type: string, format: date-time, nullable: true }
                concluido_at: { type: string, format: date-time, nullable: true }
                status_url: { type: string }

        # -----------------------------
        # Adesão
        # -----------------------------
        AdesaoResource:
            type: object
            required: [id, status, valor_total_centavos, qtd_parcelas]
            properties:
                id: { type: string }
                status:
                    type: string
                    enum: [rascunho, pendente_pagamento, ativa, cancelada, inadimplente, concluida]
                evento:
                    $ref: '#/components/schemas/EventoResource'
                pacote:
                    type: object
                    properties:
                        id: { type: string }
                        nome: { type: string }
                valor_total_centavos: { type: integer }
                qtd_parcelas: { type: integer }
                confirmada_at: { type: string, format: date-time, nullable: true }
                parcelas_resumo:
                    type: object
                    properties:
                        total: { type: integer }
                        pagas: { type: integer }
                        pendentes: { type: integer }
                        vencidas: { type: integer }
                links:
                    $ref: '#/components/schemas/ResourceLinks'

        # -----------------------------
        # Seating
        # -----------------------------
        ReservaAssentoResource:
            type: object
            required: [id, status]
            properties:
                id: { type: string }
                status:
                    type: string
                    enum: [hold, confirmada, cancelada, expirada, bloqueada]
                mesa:
                    type: object
                    properties:
                        id: { type: string }
                        numero: { type: string }
                assento:
                    type: object
                    properties:
                        id: { type: string }
                        numero: { type: integer }
                hold_expires_at: { type: string, format: date-time, nullable: true }
                confirmado_at: { type: string, format: date-time, nullable: true }
                links:
                    $ref: '#/components/schemas/ResourceLinks'

        CriarReservaRequest:
            type: object
            required: [assento_ulid, origem]
            properties:
                assento_ulid: { type: string, minLength: 26, maxLength: 26 }
                convite_ulid: { type: string, minLength: 26, maxLength: 26, nullable: true }
                origem:
                    type: string
                    enum: [formando, comissao, admin, operacao]
                observacao: { type: string, maxLength: 500, nullable: true }

        TrocarReservaRequest:
            type: object
            required: [assento_destino_ulid, origem]
            properties:
                assento_destino_ulid: { type: string, minLength: 26, maxLength: 26 }
                origem:
                    type: string
                    enum: [formando, comissao, admin, operacao]

        MapaMesaResource:
            type: object
            properties:
                mapa:
                    type: object
                    properties:
                        id: { type: string }
                        nome: { type: string }
                setores:
                    type: array
                    items:
                        type: object
                        properties:
                            id: { type: string }
                            nome: { type: string }
                            mesas:
                                type: array
                                items:
                                    type: object
                                    properties:
                                        id: { type: string }
                                        numero: { type: string }
                                        capacidade: { type: integer }
                                        assentos:
                                            type: array
                                            items:
                                                type: object
                                                properties:
                                                    id: { type: string }
                                                    numero: { type: integer }
                                                    status_runtime:
                                                        type: string
                                                        enum: [livre, hold, confirmada, bloqueado]
                                                    hold_expires_at: { type: string, format: date-time, nullable: true }
                                                    reserva_id: { type: string, nullable: true }
                atualizado_em: { type: string, format: date-time }
                deltas:
                    type: array
                    items:
                        type: object
                        properties:
                            assento_id: { type: string }
                            status_runtime: { type: string }
                            hold_expires_at: { type: string, format: date-time, nullable: true }
                            reserva_id: { type: string, nullable: true }

        # -----------------------------
        # Extras
        # -----------------------------
        ProdutoExtraResource:
            type: object
            required: [id, nome, preco_centavos]
            properties:
                id: { type: string }
                nome: { type: string }
                categoria: { type: string }
                preco_centavos: { type: integer }
                descricao: { type: string, nullable: true }
                estoque:
                    type: object
                    properties:
                        tipo: { type: string, enum: [ilimitado, finito] }
                        qtd_restante: { type: integer, nullable: true }
                imagens:
                    type: array
                    items:
                        type: object
                        properties:
                            url: { type: string, format: uri }
                            alt: { type: string }
                links:
                    $ref: '#/components/schemas/ResourceLinks'

        PedidoExtraResource:
            type: object
            required: [id, status, valor_total_centavos]
            properties:
                id: { type: string }
                status:
                    type: string
                    enum: [rascunho, aguardando_pagamento, pago, cancelado, estornado]
                valor_total_centavos: { type: integer }
                itens:
                    type: array
                    items:
                        type: object
                        properties:
                            produto:
                                type: object
                                properties:
                                    id: { type: string }
                                    nome: { type: string }
                            quantidade: { type: integer }
                            preco_unitario_centavos: { type: integer }
                pagamento:
                    $ref: '#/components/schemas/PagamentoResource'
                links:
                    $ref: '#/components/schemas/ResourceLinks'

        CriarPedidoExtraRequest:
            type: object
            required: [itens, metodo_pagamento]
            properties:
                itens:
                    type: array
                    minItems: 1
                    maxItems: 20
                    items:
                        type: object
                        required: [produto_extra_ulid, quantidade]
                        properties:
                            produto_extra_ulid: { type: string, minLength: 26, maxLength: 26 }
                            quantidade: { type: integer, minimum: 1, maximum: 10 }
                metodo_pagamento:
                    type: string
                    enum: [boleto, pix, cartao]

        # -----------------------------
        # Pagamentos
        # -----------------------------
        PagamentoResource:
            type: object
            required: [id, status, valor_centavos]
            properties:
                id: { type: string }
                status:
                    type: string
                    enum: [pendente, autorizado, pago, falhou, estornado]
                metodo:
                    type: string
                    enum: [boleto, pix, cartao]
                valor_centavos: { type: integer }
                pago_em: { type: string, format: date-time, nullable: true }
                boleto:
                    type: object
                    nullable: true
                    properties:
                        linha_digitavel: { type: string }
                        pdf_url: { type: string, format: uri }
                pix:
                    type: object
                    nullable: true
                    properties:
                        qrcode: { type: string }
                        copia_e_cola: { type: string }
                cartao:
                    type: object
                    nullable: true
                    properties:
                        last4: { type: string }
                        brand: { type: string }
                origem:
                    type: object
                    properties:
                        tipo: { type: string, enum: [parcela, pedido_extra] }
                        id: { type: string }
                        descricao: { type: string }
                comprovante_url: { type: string, format: uri, nullable: true }
                links:
                    $ref: '#/components/schemas/ResourceLinks'

        CriarPagamentoIntentRequest:
            type: object
            required: [origem_tipo, origem_ulid, metodo]
            properties:
                origem_tipo:
                    type: string
                    enum: [parcela, pedido_extra]
                origem_ulid: { type: string, minLength: 26, maxLength: 26 }
                metodo:
                    type: string
                    enum: [boleto, pix, cartao]

        # -----------------------------
        # Enquetes
        # -----------------------------
        EnqueteResource:
            type: object
            required: [id, titulo, tipo, status]
            properties:
                id: { type: string }
                titulo: { type: string }
                descricao: { type: string, nullable: true }
                tipo:
                    type: string
                    enum: [unica, multipla, ranking]
                status:
                    type: string
                    enum: [rascunho, aberta, encerrada, arquivada]
                janela:
                    type: object
                    properties:
                        abre_at: { type: string, format: date-time, nullable: true }
                        fecha_at: { type: string, format: date-time, nullable: true }
                permite_edicao: { type: boolean }
                resultado_publico: { type: boolean }
                ja_votei: { type: boolean }
                opcoes:
                    type: array
                    items:
                        type: object
                        properties:
                            id: { type: string }
                            rotulo: { type: string }
                            ordem: { type: integer }
                meu_voto:
                    type: object
                    nullable: true
                    properties:
                        opcao_id: { type: string }
                        registrado_at: { type: string, format: date-time }
                resultado:
                    type: array
                    nullable: true
                    items:
                        type: object
                        properties:
                            opcao_id: { type: string }
                            contagem: { type: integer }
                            percentual: { type: number, format: float }
                links:
                    $ref: '#/components/schemas/ResourceLinks'

        VotoResource:
            type: object
            properties:
                id: { type: string }
                registrado_at: { type: string, format: date-time }
                opcao:
                    type: object
                    properties:
                        id: { type: string }
                        rotulo: { type: string }
                links:
                    $ref: '#/components/schemas/ResourceLinks'

        RegistrarVotoRequest:
            type: object
            properties:
                opcao_ulid: { type: string, minLength: 26, maxLength: 26 }
                opcoes_ulids:
                    type: array
                    items: { type: string, minLength: 26, maxLength: 26 }
            description: |
                Para enquetes `tipo=unica`, usar `opcao_ulid`.
                Para `tipo=multipla`, usar `opcoes_ulids`.

        # -----------------------------
        # Webhook
        # -----------------------------
        WebhookPagamentoPayload:
            type: object
            required: [tipo, evento]
            properties:
                tipo:
                    type: string
                    examples: [pagamento.confirmado, pagamento.autorizado, pagamento.falhou, pagamento.estornado]
                evento:
                    type: object
                    required: [id]
                    properties:
                        id: { type: string, description: 'Gateway reference — UNIQUE com provider' }
                cobranca:
                    type: object
                    properties:
                        id: { type: string }
                        status: { type: string }
                valor_centavos: { type: integer }
                pago_em: { type: string, format: date-time }
                metadata:
                    type: object
                    additionalProperties: true

    responses:
        ValidationErrorResponse:
            description: 422 Unprocessable Entity
            content:
                application/json:
                    schema: { $ref: '#/components/schemas/ErrorEnvelope' }
        UnauthenticatedResponse:
            description: 401 Unauthenticated
            content:
                application/json:
                    schema: { $ref: '#/components/schemas/ErrorEnvelope' }
        ForbiddenResponse:
            description: 403 Forbidden
            content:
                application/json:
                    schema: { $ref: '#/components/schemas/ErrorEnvelope' }
        NotFoundResponse:
            description: 404 NotFound
            content:
                application/json:
                    schema: { $ref: '#/components/schemas/ErrorEnvelope' }
        ConflictResponse:
            description: '409 Conflict (ex.: AssentoIndisponivel, CotaEsgotada, IdempotencyConflict)'
            content:
                application/json:
                    schema: { $ref: '#/components/schemas/ErrorEnvelope' }
        GoneResponse:
            description: '410 Gone (ex.: HoldExpirado, EndpointSunset)'
            content:
                application/json:
                    schema: { $ref: '#/components/schemas/ErrorEnvelope' }
        RateLimitedResponse:
            description: 429 Too Many Requests
            headers:
                Retry-After: { $ref: '#/components/headers/RetryAfter' }
            content:
                application/json:
                    schema: { $ref: '#/components/schemas/ErrorEnvelope' }
        InternalServerErrorResponse:
            description: 500 Internal Server Error
            content:
                application/json:
                    schema: { $ref: '#/components/schemas/ErrorEnvelope' }

paths:
    # ==========================================================================
    # 1.1 POST /auth/login — totalmente especificado
    # ==========================================================================
    /auth/login:
        post:
            tags: [Autenticação]
            operationId: authLogin
            summary: Autentica o usuário do portal (SPA ou mobile).
            description: |
                - `mode=spa` — autentica via cookie de sessão (pre-requisito: `GET /sanctum/csrf-cookie`).
                - `mode=token` — retorna `access_token` para uso com `Authorization: Bearer`.

                Rate limit: `login` (5/min por `email + ip`).
            security: [] # endpoint público
            parameters:
                - $ref: '#/components/parameters/XRequestIdHeader'
            requestBody:
                required: true
                content:
                    application/json:
                        schema: { $ref: '#/components/schemas/LoginRequest' }
                        examples:
                            spa:
                                value: { email: mariana@usp.br, password: SenhaSegura#123, mode: spa }
                            token:
                                value:
                                    {
                                        email: mariana@usp.br,
                                        password: SenhaSegura#123,
                                        mode: token,
                                        device_name: Pixel-8,
                                    }
            responses:
                '200':
                    description: OK
                    content:
                        application/json:
                            schema:
                                oneOf:
                                    - $ref: '#/components/schemas/LoginSpaResponse'
                                    - $ref: '#/components/schemas/LoginTokenResponse'
                '401': { $ref: '#/components/responses/UnauthenticatedResponse' }
                '422': { $ref: '#/components/responses/ValidationErrorResponse' }
                '429': { $ref: '#/components/responses/RateLimitedResponse' }

    /auth/logout:
        post:
            tags: [Autenticação]
            operationId: authLogout
            summary: Encerra sessão SPA ou revoga token Sanctum atual.
            description: Ver `api-contract.md` §1.2.
            responses:
                '204': { description: No Content }
