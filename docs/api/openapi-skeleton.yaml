    /eventos/{ulid}/mesas/reservas:
        post:
            tags: [Seating]
            operationId: storeReservaAssento
            summary: Cria hold de 5 min em um assento livre.
            description: |
                - Exige `X-Idempotency-Key` único por request. Re-envio da mesma key com mesmo payload
                  retorna o estado atual (idempotente). Payload diferente → 409 IdempotencyConflict.
                - Policy: `ReservaAssentoPolicy::reservar`.
                - Rate limit: `throttle.actor:seating` (5/min).
                - Regra de concorrência: UNIQUE parcial `reservas_assentos_ativa_por_assento`.
            parameters:
                - $ref: '#/components/parameters/UlidPathParam'
                - $ref: '#/components/parameters/XIdempotencyKeyHeader'
                - $ref: '#/components/parameters/XRequestIdHeader'
            requestBody:
                required: true
                content:
                    application/json:
                        schema: { $ref: '#/components/schemas/CriarReservaRequest' }
                        examples:
                            simples:
                                value:
                                    assento_ulid: 01J5K3B5GTYV8E2F1W0M8P2XQA
                                    origem: formando
                            com_convite:
                                value:
                                    assento_ulid: 01J5K3B5GTYV8E2F1W0M8P2XQA
                                    convite_ulid: 01J5K3B5GTYV8E2F1W0M8P2XQB
                                    origem: formando
                                    observacao: Próximo à família
            responses:
                '201':
                    description: Criado (hold ativo)
                    headers:
                        Location:
                            schema: { type: string, format: uri }
                    content:
                        application/json:
                            schema:
                                type: object
                                properties:
                                    data: { $ref: '#/components/schemas/ReservaAssentoResource' }
                            example:
                                data:
                                    id: 01J5K2N7QMHV1FJZ8H0PR3RV9C
                                    status: hold
                                    mesa: { id: 01J5..., numero: '12' }
                                    assento: { id: 01J5..., numero: 2 }
                                    hold_expires_at: '2026-11-10T14:35:22-03:00'
                                    confirmado_at: null
                                    links:
                                        self: 'https://api.portalartfinal.com.br/api/v1/eventos/01J.../mesas/reservas/01J...'
                                        confirmar: 'https://api.portalartfinal.com.br/api/v1/eventos/01J.../mesas/reservas/01J.../confirmar'
                                        cancelar: 'https://api.portalartfinal.com.br/api/v1/eventos/01J.../mesas/reservas/01J...'
                                        trocar: 'https://api.portalartfinal.com.br/api/v1/eventos/01J.../mesas/reservas/01J.../trocar'
                '401': { $ref: '#/components/responses/UnauthenticatedResponse' }
                '403': { $ref: '#/components/responses/ForbiddenResponse' }
                '409': { $ref: '#/components/responses/ConflictResponse' }
                '422': { $ref: '#/components/responses/ValidationErrorResponse' }
                '429': { $ref: '#/components/responses/RateLimitedResponse' }

