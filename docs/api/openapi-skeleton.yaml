    # ==========================================================================
    # 10.1 POST /webhooks/pagamentos/{provider} — totalmente especificado
    # ==========================================================================
    /webhooks/pagamentos/{provider}:
        post:
            tags: [Webhooks]
            operationId: webhookPagamento
            summary: Recebe eventos de pagamento do provedor (idempotente por gateway_reference).
            description: |
                Endpoint **sem Sanctum**, autenticação por HMAC em `X-Signature`.
                - `firstOrCreate` em `webhook_eventos` via UNIQUE `(provider, gateway_reference)`.
                - Se novo: retorna 202. Se já processado: 200 com `status: already_processed`.
                - Rate limit `webhook` (600/min/IP). IPs do provider preferencialmente em allow-list WAF.
            security: []
            parameters:
                - name: provider
                  in: path
                  required: true
                  schema:
                      type: string
                      enum: [itau, mock]
                - name: X-Signature
                  in: header
                  required: true
                  description: "hash_hmac('sha256', rawBody, webhookSecret)"
                  schema: { type: string }
                - $ref: '#/components/parameters/XRequestIdHeader'
            requestBody:
                required: true
                content:
                    application/json:
                        schema: { $ref: '#/components/schemas/WebhookPagamentoPayload' }
                        example:
                            tipo: pagamento.confirmado
                            evento: { id: ITAU-EVT-20260417-0007 }
                            cobranca: { id: ITAU-20260417-0001, status: pago }
                            valor_centavos: 150099
                            pago_em: '2026-04-17T14:32:11-03:00'
                            metadata: { adesao_ulid: 01J... }
            responses:
                '202':
                    description: Aceito (novo evento)
                    content:
                        application/json:
                            schema:
                                type: object
                                properties:
                                    status: { type: string, example: accepted }
                '200':
                    description: Já processado (idempotência)
                    content:
                        application/json:
                            schema:
                                type: object
                                properties:
                                    status: { type: string, example: already_processed }
                '400':
                    description: 'Payload inválido (ex.: `evento.id` ausente)'
                    content:
                        application/json:
                            schema: { $ref: '#/components/schemas/ErrorEnvelope' }
                '401':
                    description: Assinatura HMAC inválida
                    content:
                        application/json:
                            schema: { $ref: '#/components/schemas/ErrorEnvelope' }
                '429':
                    $ref: '#/components/responses/RateLimitedResponse'
# ═══════════════════════════════════════════════════════════════════════
# Adesão pública (SPEC-010 v2.0.0 — código do contrato)
# ═══════════════════════════════════════════════════════════════════════
# Stub adicionado em 2026-04-23. Paths completos, schemas e exemplos vivem em
# docs/features/SPEC-010-adesao-publica-codigo-contrato.md §2 (contratos de API).
# Expansão para OpenAPI oficial prevista no plano executável:
# docs/superpowers/plans/2026-04-19-adesao-publica-codigo-contrato-plan.md (Gate 3).
#
# Endpoints (sob /api/v1/adesao/publico/):
#   GET  /{codigo-contrato}              → ContratoPublicoResponse
#   POST /{codigo-contrato}/iniciar      → DraftTokenResponse | 409 MustLogin
#   POST /simular                        → SimulacaoResponse
#   POST /commit                         → AdesaoCommitResponse (201 + auto_login_token)
#
# Bloco admin:
#   PATCH  /api/v1/admin/contratos/{contrato:ulid}/codigo-acesso
#   DELETE /api/v1/admin/contratos/{contrato:ulid}/codigo-acesso
#   PATCH  /api/v1/admin/contratos/{contrato:ulid}/adesao-publica
#
# Headers comuns: X-Adesao-Draft-Token (JWT HS256 TTL 48h), X-Idempotency-Key
# (commit e mutações que causam side-effects).
#
# Exemplo mínimo de um path (implementação completa será adicionada pela squad
# no Gate 3 do plano executável):
#
#   /adesao/publico/{codigo-contrato}:
#     get:
#       operationId: adesaoPublicoShow
#       tags: [adesao-publica]
#       parameters:
#         - in: path
#           name: codigo-contrato
#           required: true
#           schema:
#             type: string
#             pattern: '^[A-Z0-9-]{4,32}$'
#             example: ARTFINAL-USP-MED-2026
#       responses:
#         '200':
#           description: Contrato + turmas disponíveis + pacotes formatura + condições
#           content:
#             application/json:
#               schema:
#                 $ref: '#/components/schemas/ContratoPublicoResponse'
#         '404':
#           description: Código inválido ou contrato não encontrado
#         '403':
#           description: Adesão pública desabilitada ou contrato encerrado
#         '429':
#           $ref: '#/components/responses/RateLimitedResponse'
